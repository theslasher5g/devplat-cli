name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: vet · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # single source of truth, no second version to drift
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...
      - run: go test ./... -race
      - run: go build ./...

  cross-compile:
    name: release targets compile
    runs-on: ubuntu-latest
    # This CLI ships as prebuilt binaries from get.devplat.ch, so a change that
    # only compiles on Linux is not caught by the job above — it's caught by a
    # user on Windows. Build every published target on every push instead.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: windows, goarch: amd64 }
          # Not published yet, but building them keeps the port honest so
          # "add macOS/arm64" stays a release-script change, not a debugging one.
          - { goos: darwin, goarch: arm64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o /dev/null ./cmd/devplat
