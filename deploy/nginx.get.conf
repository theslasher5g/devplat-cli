# Static file server for get.devplat.ch. The root path IS the install
# script — `curl -fsSL https://get.devplat.ch | sh` needs "/" itself to
# return install.sh's content, not an index page (same pattern
# get.docker.com/rustup.rs use).
server {
    listen 80;
    server_name get.devplat.ch;
    root /usr/share/nginx/html;

    location = / {
        default_type text/x-sh;
        try_files /install.sh =404;
    }

    location = /install.ps1 {
        default_type text/plain;
    }

    # The release signing key, for anyone verifying a download by hand (the
    # Download page's instructions fetch it from here). text/plain so it opens
    # in a browser rather than downloading, and only briefly cached: on a
    # rotation, a stale key here has people rejecting genuine releases.
    location = /devplat-release.pub.pem {
        default_type text/plain;
        add_header Cache-Control "public, max-age=300";
    }

    location = /version.txt {
        add_header Cache-Control "no-cache";
        default_type text/plain;
    }

    # Versioned release archives + checksums — immutable once published, so
    # cache aggressively.
    location ~ ^/v[0-9] {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
